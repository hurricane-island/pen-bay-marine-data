[workspace]
authors = ["Keeney <nkeeney@hurricaneisland.net>", "Adele Jordan", "Madeleine Regulla", "Ivan Prymak"]
channels = ["conda-forge"]
name = "pen-bay-marine-data"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

[tasks]
penbay = "python cli.py"
weather = "balena build --fleet weather"
deploy = "balena deploy weather"
develop = "balena deploy weather-dev --build --nocache --multi-dockerignore"

[dependencies]
python = "==3.13"
typing_extensions = "*"
pandas = ">=3.0.3,<4"
click = ">=8.4.2,<9"
black = ">=26.5.1,<27"
matplotlib = ">=3.10.5,<4"
numpy = ">=2.3.2,<3"
pip = ">=26.1.2,<27"
ioos_qc = ">=2.2.1,<3"
gpxpy = ">=1.6.2,<2"
pytest = ">=9.1.1,<10"
scipy = ">=1.18.0,<2"
pyproj = ">=3.7.2,<4"
requests = ">=2.34.2,<3"
cartopy = ">=0.25.0,<0.26"

[pypi-dependencies]
"influxdb3-python" = "~=0.20.0"
weewx = ">=5.1.0, <6"
balena-sdk = ">=17.2.0, <18"
sphinx = ">=9.1.0, <10"
sphinx-click = ">=6.0.0, <7"
