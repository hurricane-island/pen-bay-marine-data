            period: "month"
          - tspan: [7, 9]
            vspan: [29.0, 32.0]
            period: "month"
          - tspan: [10, 12]
            vspan: [25.0, 35.0]
            period: "month"
      rate_of_change_test:
        threshold: 0.0190
      spike_test:
        suspect_threshold: 21.0
        fail_threshold: 21.741370
      location_test:
        bbox: [-68.92789, 44.31769, -68.92601, 44.31905]
  sea_water_chlorophyll_rfu:
