streams:
  sea_water_temperature:
    qartod:
      gross_range_test:
        suspect_span: [-1.0, 26.0]
        fail_span: [-5.0, 50.0]
      climatology_test:
        zinp: []  # required, but empty
      spike_test:
        method: differential  # will not catch tails, only values with neighbors
      flat_line_test:
        tolerance: 0.001
        suspect_threshold: 28800.0 # seconds, 8 hours
        fail_threshold: 43200.0 # seconds, 12 hours
      location_test:
        bbox:
  sea_water_salinity:
    qartod:
      gross_range_test:
        suspect_span: [27.0, 35.0]
        fail_span: [0.0, 70.0]
      climatology_test:
        zinp: []
      rate_of_change_test:
        threshold: 0.0190
      spike_test:
        method: differential
      flat_line_test:
        tolerance: 0.001
        suspect_threshold: 28800.0
        fail_threshold: 43200.0
  sea_water_chlorophyll_rfu:
    qartod:
      gross_range_test:
        suspect_span: [0.0, 50.0]
        fail_span: [0.0, 100.0]
      climatology_test:
        zinp: []
      spike_test:
        method: differential
      flat_line_test:
        tolerance: 0.001
        suspect_threshold: 28800.0
        fail_threshold: 43200.0
  sea_water_phycoerythrin_rfu:
    qartod:
      gross_range_test:
        suspect_span: [0.0, 25.0]
        fail_span: [0.0, 100.0]
      climatology_test:
        zinp: []
      spike_test:
        method: differential
      flat_line_test:
        tolerance: 0.001
        suspect_threshold: 28800.0
        fail_threshold: 43200.0

