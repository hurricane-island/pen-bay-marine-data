streams:
  sea_water_temperature:
    qartod:
      gross_range_test:
        suspect_span: [0.1, 26.0]
        fail_span: [-4.0, 35.0]

      climatology_test:
        config:  # list of objects, each with a tspan, and vspan
          - tspan: ["1-1", "3-31"]
            vspan: [0.1, 15.0]
          - tspan: ["4-1", "6-30"]
            vspan: [0.1, 15.0]
          - tspan: ["7-1", "9-30"]
            vspan: [0.1, 15.0]
          - tspan: ["10-1", "12-31"]
            vspan: [0.1, 15.0]
        zinp: []  # required, but empty

      rate_of_change_test:
        threshold: 0.00029  # units per second, C or K

      spike_test:
        suspect_threshold: 0.4  # dimensionless
        fail_threshold: 0.5  # dimensionless
        method: differential  # will not catch tails, only values with neighbors

      flat_line_test:
        tolerance: 0.001
        suspect_threshold: 28800 # seconds, 8 hours
        fail_threshold: 43200 # seconds, 12 hours
  
