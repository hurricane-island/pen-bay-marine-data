streams:
  sea_water_temperature:
    qartod:
      gross_range_test:
        suspect_span: [-1, 26.0]
        fail_span: [-5.0, 50.0]

      climatology_test:
        config:  # list of objects, each with a tspan, and vspan
          - tspan: ["1-1", "3-31"]
            vspan: [0.1, 15.0]
          - tspan: ["4-1", "6-30"]
            vspan: [0.1, 15.0]
          - tspan: ["7-1", "9-30"]
            vspan: [0.1, 15.0]
          - tspan: ["10-1", "12-31"]
            vspan: [0.1, 15.0]
        zinp: []  # required, but empty

      rate_of_change_test:
        threshold: 0.000156  # units per second, C or K 99% of slope change. 

      spike_test:
        suspect_threshold: 0.4  # dimensionless
        fail_threshold: 0.567605 # dimensionless
        method: differential  # will not catch tails, only values with neighbors

      flat_line_test:
        tolerance: 0.001
        suspect_threshold: 28800 # seconds, 8 hours
        fail_threshold: 43200 # seconds, 12 hours
  
  sea_water_salinity:
    qartod:
      gross_range_test:
         suspect_span: [27, 35]
         fail_span: [0, 70]
      
      climatology_test:
        config:  # list of objects, each with a tspan, and vspan
          - tspan: ["1-1", "3-31"]
            vspan: [25,35 ] # 
          - tspan: ["4-1", "6-30"]
            vspan: [29,32 ]
          - tspan: ["7-1", "9-30"] 
            vspan: [29,32 ]
          - tspan: ["10-1", "12-31"]
            vspan: [25,35 ] # 
        zinp: []  # required, but empty

      rate_of_change_test:
         threshold: 0.0190 

      spike_test:
         suspect_threshold: 
         fail_threshold: 21.741370

      flat_line_test:
         tolerance: 0.001
         suspect_threshold: 28800
         fail_threshold: 43200
  
  sea_water_chlorophyll_rfu:
