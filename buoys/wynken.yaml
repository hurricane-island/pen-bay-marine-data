      climatology_test:
        config:
          - tspan: [1, 3]
            vspan: [0.0, 0.8]
            period: "month"
          - tspan: [4, 6]
            vspan: [0.1, 1.5]
            period: "month"
          - tspan: [7, 9]
            vspan: [0.1, 3.0]
            period: "month"
          - tspan: [10, 12]
            vspan: [0.1, 2.0]
            period: "month"
      rate_of_change_test:
        threshold: 0.000335
